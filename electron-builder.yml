# Packaging ADCode into something a person can double-click.
#
# The app manifest is the repo's own package.json rather than apps/desktop's, because the
# repo is not an npm workspace (deviation D6: FAT32 has no symlinks) and every runtime
# dependency therefore lives in the root node_modules. `extraMetadata.main` retargets the
# entry point at the built main process.

appId: com.adcode.ide
productName: ADCode
copyright: ADCode

# node-pty ships N-API prebuilds, which are ABI-stable across Node and Electron versions
# and need no rebuild. Letting electron-builder run @electron/rebuild anyway drags in
# node-gyp and winpty's build scripts, which need a full MSVC toolchain to produce a
# binary identical to the one already in the box.
npmRebuild: false

directories:
  output: release
  buildResources: build

extraMetadata:
  main: apps/desktop/out/main/index.js

files:
  - apps/desktop/out/**/*
  - package.json
  # The main process reads this at runtime for the window icon, so it has to be inside the
  # asar. `buildResources` above only feeds the installer and the executable's own embedded
  # icon; it puts nothing where a running app can read it, which is why the packaged build
  # logged "Failed to load image from path ...app.asar\build\icon.png" on every launch.
  - build/icon.png
  # Vite bundles these into the renderer at build time; the copies in node_modules would
  # be about a hundred megabytes of dead weight inside the installer.
  - "!node_modules/monaco-editor/**"
  - "!node_modules/@xterm/**"
  - "!node_modules/typescript/**"
  - "!node_modules/electron/**"
  - "!node_modules/electron-builder/**"
  - "!node_modules/app-builder-lib/**"
  - "!node_modules/vite/**"
  - "!node_modules/vitest/**"
  - "!node_modules/esbuild/**"
  - "!node_modules/@esbuild/**"
  - "!node_modules/dependency-cruiser/**"
  - "!node_modules/.cache/**"

# node-pty resolves its native binary by building a path at runtime, which cannot be read
# from inside an asar archive.
asarUnpack:
  - "**/node_modules/node-pty/**"

# Where updates come from. electron-updater reads this same block at runtime to find the
# feed, so the app and the installer always agree on where releases live.
#
# The repo below is a placeholder - set GH_OWNER and GH_REPO, or edit it, before the first
# real release. Publishing to the wrong repo produces installers that check an update feed
# nobody publishes to, and they never update again.
publish:
  provider: github
  owner: adcode
  repo: adcode

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    # A portable build for anyone who would rather not run an installer.
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ADCode

mac:
  icon: build/icon.png
  target: [dmg]
  category: public.app-category.developer-tools

linux:
  icon: build/icon.png
  # AppImage runs anywhere without a package manager; .deb is what most people expect on
  # Debian and Ubuntu. Both are produced, and the install script picks between them.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  synopsis: An ad-supported, AI-native IDE
  desktop:
    entry:
      Name: ADCode
      Categories: Development;IDE;
