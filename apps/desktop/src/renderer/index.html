<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ADCode</title>
  </head>
  <body>
    <div id="titlebar" class="titlebar">
      <div class="menubar-slot" id="menubar-slot"></div>
      <div class="titlebar-drag">
        <span class="titlebar-title" id="titlebar-title">ADCode</span>
      </div>
    </div>

    <div id="workbench" class="workbench">
      <aside class="activitybar" id="activitybar">
        <button class="activity" data-view="explorer" title="Explorer" aria-label="Explorer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h3.4c.5 0 1 .2 1.4.6l1.1 1.1c.2.2.4.3.7.3h6.4A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>
        </button>
        <button class="activity" data-view="search" title="Search (Ctrl+Shift+F)" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        </button>
        <button class="activity" data-view="scm" title="Source control (Ctrl+Shift+G)" aria-label="Source control">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="6" r="2.5"/><circle cx="7" cy="18" r="2.5"/><circle cx="17" cy="12" r="2.5"/><path d="M7 8.5v7M9.5 6h3a2 2 0 0 1 2 2v2"/></svg>
        </button>
        <button class="activity activity-bottom" id="open-settings" data-view="settings" title="Settings (Ctrl+,)" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6L18 18M18 6l-1.4 1.4M7.4 16.6L6 18"/></svg>
        </button>
      </aside>

      <aside class="sidebar" id="sidebar">
        <header class="sidebar-header">
          <span class="sidebar-title" id="sidebar-title">No Folder Opened</span>
          <button class="ghost-button" id="open-folder">Open</button>
        </header>
        <nav class="filetree" id="filetree" aria-label="Files">
          <p class="empty-hint">Open a folder to get started.</p>
        </nav>
        <div class="sidebar-view" id="view-search" hidden></div>
        <div class="sidebar-view" id="view-scm" hidden></div>
      </aside>

      <main class="main">
        <div class="tabs" id="tabs" role="tablist"></div>

        <section class="editor-area">
          <div class="editor-host" id="editor-host"></div>
          <div class="editor-placeholder" id="editor-placeholder">
            <div class="placeholder-inner">
              <h1>ADCode</h1>
              <p>Open a folder, pick a file, and start editing.</p>
              <dl class="shortcuts">
                <div><dt>Save</dt><dd><kbd>Ctrl</kbd><kbd>S</kbd></dd></div>
                <div><dt>Terminal</dt><dd><kbd>Ctrl</kbd><kbd>`</kbd></dd></div>
              </dl>
            </div>
          </div>
        </section>

        <section class="panel" id="panel" hidden>
          <header class="panel-header">
            <span class="panel-title">Terminal</span>
            <div class="terminal-tabs" id="terminal-tabs" role="tablist" hidden></div>
            <select class="profile-select" id="profile-select" aria-label="Terminal profile"></select>
            <button class="icon-button" id="terminal-new" title="New terminal (Ctrl+Shift+`)" aria-label="New terminal">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg>
            </button>
            <button class="icon-button" id="terminal-split" title="Split terminal (Ctrl+Shift+5)" aria-label="Split terminal">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3h11v10h-11z M8 3v10"/></svg>
            </button>
            <button class="icon-button" id="terminal-kill" title="Kill terminal" aria-label="Kill terminal">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 6.5v5M8 6.5v5M10.5 6.5v5M3 4h10M6 4V2.5h4V4M4.5 4l.6 9.5h5.8L11.5 4"/></svg>
            </button>
            <button class="icon-button" id="panel-close" title="Close panel (Ctrl+J)" aria-label="Close panel">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
            </button>
          </header>
          <div class="terminal-surface" id="terminal-surface"></div>
        </section>
      </main>
    </div>

    <footer class="statusbar" id="statusbar">
      <span class="status-item" id="status-workspace">No folder</span>
      <span class="status-spacer"></span>
      <span class="status-item" id="status-position">Ln 1, Col 1</span>
      <span class="status-item" id="status-language"></span>
      <span class="status-item" id="status-earnings"></span>
      <span class="status-item" id="status-dirty"></span>
    </footer>

    <div class="toast-layer" id="toast-layer" aria-live="polite"></div>

    

    <script type="module" src="./main.ts"></script>
  </body>
</html>
