<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    The ADCode mark: a dollar sign between two angle brackets, folded as one ribbon.

    Path for path the same as `apps/desktop/src/renderer/workbench/brandMark.ts` and the
    site's `Mark.tsx`. A logo that differs between the app and the site is two logos.

    The plate is part of the icon and not of the inline mark: an app icon needs its own
    ground to sit on, and an inline mark needs to take the colour around it.

    Next serves this as the favicon by file convention - the name `icon.svg` in `app/` is
    what wires it up, so there is no `<link>` anywhere to keep in step with it.

    A copy of `build/icon.svg` rather than an import: the desktop build and the website are
    separate projects on a volume with no symlinks, and a favicon is 1KB.
  -->
  <defs>
    <linearGradient id="adcodeFold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#000" stop-opacity=".16"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="adcodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#ffffff" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="#050505"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" filter="url(#adcodeGlow)">
    <path d="M320 348L140 512L320 676" stroke-width="96"/>
    <path d="M704 348L884 512L704 676" stroke-width="96"/>
    <path d="M512 296V388" stroke-width="64"/>
    <path d="M512 636V728" stroke-width="64"/>
    <path d="M584 405C563 374 531 356 494 356C446 356 413 383 413 423C413 463 444 484 505 500C569 517 606 541 606 590C606 641 565 671 511 671C466 671 429 651 405 619" stroke-width="92"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 478L128 546L198 512Z" fill="url(#adcodeFold)" stroke="none"/>
    <path d="M896 478L896 546L826 512Z" fill="url(#adcodeFold)" stroke="none"/>
    <path d="M292 358L164 474" stroke="#fff" stroke-width="20" opacity=".26"/>
    <path d="M732 358L860 474" stroke="#fff" stroke-width="20" opacity=".26"/>
    <path d="M164 550L292 666" stroke="#000" stroke-width="20" opacity=".2"/>
    <path d="M860 550L732 666" stroke="#000" stroke-width="20" opacity=".2"/>
    <path d="M480 340L544 340L522 394L498 394Z" fill="#000" opacity=".3" stroke="none"/>
    <path d="M480 630L544 630L522 684L498 684Z" fill="#000" opacity=".3" stroke="none"/>
    <path d="M492 512Q560 536 512 576" stroke="#000" stroke-width="32" opacity=".22"/>
    <path d="M440 400Q450 375 490 368" stroke="#fff" stroke-width="15" opacity=".24"/>
  </g>
</svg>
