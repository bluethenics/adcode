<svg xmlns="http://www.w3.org/2000/svg" width="760" height="274" viewBox="0 0 760 274" role="img" aria-labelledby="t d"><title id="t">What a solved task costs</title><desc id="d">ADCode 23,952, OpenCode 24,744, Claude Code 63,791</desc><rect width="760" height="274" rx="16" fill="#12161d"/><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="32" y="44" fill="#eef1f5" font-size="20" font-weight="650">What a solved task costs</text><text x="32" y="70" fill="#a9b5c4" font-size="14">Real model, cache-adjusted, in input-token equivalents. Lower is better.</text><text x="136" y="121" fill="#eef1f5" font-size="14" text-anchor="end" font-weight="650">ADCode</text><rect x="150" y="106" width="168.0658261408381" height="24" rx="4" fill="#2f81f7"/><text x="328.0658261408381" y="123" fill="#eef1f5" font-size="13" font-weight="650">23,952</text><text x="136" y="167" fill="#a9b5c4" font-size="14" text-anchor="end">OpenCode</text><rect x="150" y="152" width="173.62926354200397" height="24" rx="4" fill="#c97b5a"/><text x="333.62926354200397" y="169" fill="#eef1f5" font-size="13">24,744</text><text x="136" y="213" fill="#a9b5c4" font-size="14" text-anchor="end">Claude Code</text><rect x="150" y="198" width="447.6190476190476" height="24" rx="4" fill="#c97b5a"/><text x="607.6190476190476" y="215" fill="#eef1f5" font-size="13">63,791</text><line x1="150" x2="150" y1="98" y2="238" stroke="rgba(192,213,239,0.22)"/></g></svg>
