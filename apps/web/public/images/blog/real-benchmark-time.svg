<svg xmlns="http://www.w3.org/2000/svg" width="760" height="286" viewBox="0 0 760 286" role="img" aria-labelledby="t d"><title id="t">Where the time goes</title><desc id="d">ADCode: 20 s, of which harness 0.5 s; Claude Code: 36 s, of which harness 5.5 s; OpenCode: 40 s, of which harness 11.4 s</desc><rect width="760" height="286" rx="16" fill="#12161d"/><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="32" y="44" fill="#eef1f5" font-size="20" font-weight="650">Where the time goes</text><text x="32" y="70" fill="#a9b5c4" font-size="14">Median task, real model. Grey is the model thinking and writing; colour is the harness.</text><rect x="32" y="88" width="12" height="12" rx="3" fill="#5b6b80"/><text x="50" y="98" fill="#a9b5c4" font-size="13">Model time</text><rect x="222" y="88" width="12" height="12" rx="3" fill="#2f81f7"/><text x="240" y="98" fill="#a9b5c4" font-size="13">Harness time</text><text x="136" y="133" fill="#eef1f5" font-size="14" text-anchor="end" font-weight="650">ADCode</text><rect x="150" y="118" width="245.83897157767748" height="24" rx="4" fill="#5b6b80"/><rect x="396.8389715776775" y="118" width="6.2314598809745405" height="24" rx="4" fill="#2f81f7"/><text x="413.070431458652" y="135" fill="#eef1f5" font-size="13" font-weight="650">20 s (harness 0.5 s)</text><text x="136" y="179" fill="#a9b5c4" font-size="14" text-anchor="end">Claude Code</text><rect x="150" y="164" width="343.66839941040286" height="24" rx="4" fill="#5b6b80"/><rect x="494.66839941040286" y="164" width="70.34939569026079" height="24" rx="4" fill="#c97b5a"/><text x="575.0177951006636" y="181" fill="#eef1f5" font-size="13">36 s (harness 5.5 s)</text><text x="136" y="225" fill="#a9b5c4" font-size="14" text-anchor="end">OpenCode</text><rect x="150" y="210" width="300.83754127896697" height="24" rx="4" fill="#5b6b80"/><rect x="451.83754127896697" y="210" width="145.78150634008057" height="24" rx="4" fill="#c97b5a"/><text x="607.6190476190475" y="227" fill="#eef1f5" font-size="13">40 s (harness 11.4 s)</text><line x1="150" x2="150" y1="110" y2="250" stroke="rgba(192,213,239,0.22)"/></g></svg>
