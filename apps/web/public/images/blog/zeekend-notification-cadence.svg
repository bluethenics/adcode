<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t d">
<title id="t">Sponsored notifications, back to back at your frequency</title><desc id="d">Light shows a card every 30 minutes, Standard every 10, Max every 5. A slot Zeekend leaves empty is asked again 20 seconds later.</desc>
<rect width="760" height="330" rx="16" fill="#12161d"/>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<text x="32" y="44" fill="#eef1f5" font-size="20" font-weight="650">Sponsored notifications, back to back at your frequency</text>
<text x="32" y="70" fill="#a9b5c4" font-size="14">Each block is one Zeekend card. The app wakes when the next slot opens, not on a fixed minute timer.</text>
<line x1="120" x2="120" y1="102" y2="264" stroke="rgba(192,213,239,0.14)"/><text x="120" y="284" fill="#8c99aa" font-size="12" text-anchor="middle">0 min</text><line x1="220" x2="220" y1="102" y2="264" stroke="rgba(192,213,239,0.14)"/><text x="220" y="284" fill="#8c99aa" font-size="12" text-anchor="middle">5 min</text><line x1="320" x2="320" y1="102" y2="264" stroke="rgba(192,213,239,0.14)"/><text x="320" y="284" fill="#8c99aa" font-size="12" text-anchor="middle">10 min</text><line x1="420" x2="420" y1="102" y2="264" stroke="rgba(192,213,239,0.14)"/><text x="420" y="284" fill="#8c99aa" font-size="12" text-anchor="middle">15 min</text><line x1="520" x2="520" y1="102" y2="264" stroke="rgba(192,213,239,0.14)"/><text x="520" y="284" fill="#8c99aa" font-size="12" text-anchor="middle">20 min</text><line x1="620" x2="620" y1="102" y2="264" stroke="rgba(192,213,239,0.14)"/><text x="620" y="284" fill="#8c99aa" font-size="12" text-anchor="middle">25 min</text><line x1="720" x2="720" y1="102" y2="264" stroke="rgba(192,213,239,0.14)"/><text x="720" y="284" fill="#8c99aa" font-size="12" text-anchor="middle">30 min</text><text x="104" y="129" fill="#a9b5c4" font-size="14" text-anchor="end">Light</text><rect x="120" y="112" width="10" height="26" rx="5" fill="#2f81f7"/><text x="104" y="185" fill="#a9b5c4" font-size="14" text-anchor="end">Standard</text><rect x="120" y="168" width="10" height="26" rx="5" fill="#2f81f7"/><rect x="320" y="168" width="10" height="26" rx="5" fill="#2f81f7"/><rect x="520" y="168" width="10" height="26" rx="5" fill="#2f81f7"/><text x="104" y="241" fill="#a9b5c4" font-size="14" text-anchor="end">Max</text><rect x="120" y="224" width="10" height="26" rx="5" fill="#2f81f7"/><rect x="220" y="224" width="10" height="26" rx="5" fill="#2f81f7"/><rect x="320" y="224" width="10" height="26" rx="5" fill="#2f81f7"/><rect x="420" y="224" width="10" height="26" rx="5" fill="#2f81f7"/><rect x="520" y="224" width="10" height="26" rx="5" fill="#2f81f7"/><rect x="620" y="224" width="10" height="26" rx="5" fill="#2f81f7"/><rect x="420" y="224" width="10" height="26" rx="5" fill="none" stroke="#a9b5c4" stroke-dasharray="3 3"/><text x="436" y="216" fill="#a9b5c4" font-size="12">no card: asked again 20 s later</text>
</g></svg>
