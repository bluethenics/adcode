<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="t d">
<title id="t">What it costs to start, per month</title><desc id="d">ADCode, OpenCode and T3 Code cost nothing to start; Codex and Claude Code start at $20 a month.</desc>
<rect width="760" height="360" rx="16" fill="#12161d"/>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<text x="32" y="44" fill="#eef1f5" font-size="20" font-weight="650">What it costs to start, per month</text>
<text x="32" y="70" fill="#a9b5c4" font-size="14">Cheapest plan with the agent working on your own computer. Public pricing, 13 November 2026.</text>
<text x="136" y="120" fill="#eef1f5" font-size="14" text-anchor="end" font-weight="650">ADCode</text><rect x="150" y="106" width="3" height="22" rx="1.5" fill="#2f81f7"/><text x="163" y="122" fill="#eef1f5" font-size="14" font-weight="650">$0</text><text x="520" y="122" fill="#8c99aa" font-size="12">Free AI built in, 140 requests a day</text><text x="136" y="166" fill="#a9b5c4" font-size="14" text-anchor="end" >OpenCode</text><rect x="150" y="152" width="3" height="22" rx="1.5" fill="#2f81f7"/><text x="163" y="168" fill="#eef1f5" font-size="14" font-weight="650">$0</text><text x="520" y="168" fill="#8c99aa" font-size="12">Free app; you pay your model provider</text><text x="136" y="212" fill="#a9b5c4" font-size="14" text-anchor="end" >T3 Code</text><rect x="150" y="198" width="3" height="22" rx="1.5" fill="#2f81f7"/><text x="163" y="214" fill="#eef1f5" font-size="14" font-weight="650">$0</text><text x="520" y="214" fill="#8c99aa" font-size="12">Free app; needs a Codex or Claude plan</text><text x="136" y="258" fill="#a9b5c4" font-size="14" text-anchor="end" >Codex</text><path d="M150,244 H394 Q398,244 398,248 V262 Q398,266 394,266 H150 Z" fill="#2f81f7"/><text x="408" y="260" fill="#eef1f5" font-size="14" font-weight="650">$20</text><text x="520" y="260" fill="#8c99aa" font-size="12">ChatGPT Plus; Free and Go get a lighter model</text><text x="136" y="304" fill="#a9b5c4" font-size="14" text-anchor="end" >Claude Code</text><path d="M150,290 H394 Q398,290 398,294 V308 Q398,312 394,312 H150 Z" fill="#2f81f7"/><text x="408" y="306" fill="#eef1f5" font-size="14" font-weight="650">$20</text><text x="520" y="306" fill="#8c99aa" font-size="12">Claude Pro; not in the free plan</text><line x1="150" x2="150" y1="94" y2="330" stroke="rgba(192,213,239,0.22)"/>
</g></svg>
