<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="t d">
<title id="t">Why a moving cursor used to cost money</title><desc id="d">Diagram: in 2.6.0 the host context changed between steps and the whole conversation after it was re-sent; in 2.6.1 it is held per message and the conversation is read from cache.</desc>
<rect width="760" height="360" rx="16" fill="#12161d"/>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<text x="32" y="44" fill="#eef1f5" font-size="20" font-weight="650">Why a moving cursor used to cost money</text>
<text x="32" y="70" fill="#a9b5c4" font-size="14">Providers cache a request by its prefix. Anything that changes early spends the cache after it.</text>
<text x="32" y="116" fill="#eef1f5" font-size="14" font-weight="650">2.6.0 - context read again at every step</text><rect x="32" y="128" width="150" height="40" rx="6" fill="rgba(47,129,247,0.35)" /><text x="107" y="153" fill="#eef1f5" font-size="12.5" text-anchor="middle">Tools + instructions</text><rect x="186" y="128" width="120" height="40" rx="6" fill="rgba(201,123,90,0.55)" stroke="#eef1f5" stroke-dasharray="4 3"/><text x="246" y="153" fill="#eef1f5" font-size="12.5" text-anchor="middle">Host context</text><rect x="310" y="128" width="418" height="40" rx="6" fill="rgba(201,123,90,0.55)" /><text x="519" y="153" fill="#eef1f5" font-size="12.5" text-anchor="middle">Whole conversation - written again at 1.25×</text><text x="32" y="190" fill="#a9b5c4" font-size="12.5">The cursor moved or a command started, so the context changed - and everything after it missed the cache.</text><text x="32" y="228" fill="#eef1f5" font-size="14" font-weight="650">2.6.1 - context held for the whole message</text><rect x="32" y="240" width="150" height="40" rx="6" fill="rgba(47,129,247,0.35)" /><text x="107" y="265" fill="#eef1f5" font-size="12.5" text-anchor="middle">Tools + instructions</text><rect x="186" y="240" width="120" height="40" rx="6" fill="rgba(47,129,247,0.35)" stroke="#eef1f5" stroke-dasharray="4 3"/><text x="246" y="265" fill="#eef1f5" font-size="12.5" text-anchor="middle">Host context</text><rect x="310" y="240" width="418" height="40" rx="6" fill="rgba(47,129,247,0.35)" /><text x="519" y="265" fill="#eef1f5" font-size="12.5" text-anchor="middle">Conversation - read from cache at 0.1×</text><text x="32" y="302" fill="#a9b5c4" font-size="12.5">Only the newest step is new. Stale file reads are cleared in batches, so the cache rarely has to be rebuilt.</text><rect x="32" y="328" width="12" height="12" rx="3" fill="rgba(47,129,247,0.6)"/><text x="50" y="338" fill="#a9b5c4" font-size="13">Read from cache</text><rect x="170" y="328" width="12" height="12" rx="3" fill="rgba(201,123,90,0.8)"/><text x="188" y="338" fill="#a9b5c4" font-size="13">Sent again at full price</text>
</g></svg>
