# Run the full verification on every pull request.
#
# `pull_request`, never the variant that runs in the base repository's context: that one
# runs with the base repository's credentials against code from a fork, which is how a pull
# request steals a signing key. The one credential here is `ADCODE_PKG_TOKEN`, which only
# reads the package that holds the website's ad SDK; it is scoped to npm.pkg.github.com and
# reaches `npm ci` for `apps/web`, nothing else.
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Imprezia's ad SDK (`@adimpress/imprezia-sdk`) lives in GitHub Packages and needs the
      # read-only token from Imprezia's dashboard. Without the secret this step fails on a
      # 401 naming the registry, so it is a repository setting, not a contributor one.
      - run: npm --prefix apps/web ci --ignore-scripts
        env:
          ADCODE_PKG_TOKEN: ${{ secrets.ADCODE_PKG_TOKEN }}
      - run: npm --prefix apps/cloud ci --ignore-scripts
      - run: node apps/cloud/node_modules/wrangler/bin/wrangler.js deploy --dry-run --config apps/collab-relay/wrangler.jsonc --outdir output/collab-relay-build
      - run: node scripts/check-shared-projects.mjs
      - name: Prepare Electron sandbox for GUI tests
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: xvfb-run -a npm run verify
